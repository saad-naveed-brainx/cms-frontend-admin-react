# cms-admin at admin.nodepress.brainxdemo.com: the built files in dist/, served as they are (the api
# repo's deploy/README.md, step 7). nodepress.brainxdemo.com itself redirects here. The certificate is
# the wildcard for nodepress.brainxdemo.com from step 6.

server {
    listen 80;
    server_name admin.nodepress.brainxdemo.com nodepress.brainxdemo.com;
    return 301 https://admin.nodepress.brainxdemo.com$request_uri;
}

server {
    listen 443 ssl;
    server_name nodepress.brainxdemo.com;

    ssl_certificate     /etc/letsencrypt/live/nodepress.brainxdemo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodepress.brainxdemo.com/privkey.pem;

    return 301 https://admin.nodepress.brainxdemo.com$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.nodepress.brainxdemo.com;

    ssl_certificate     /etc/letsencrypt/live/nodepress.brainxdemo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodepress.brainxdemo.com/privkey.pem;

    # This repo's dist/ after `npm run build`.
    root /srv/nodepress/admin/dist;
    index index.html;

    # Built files carry a fingerprint in their names, so they can be kept for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address is a screen of the app (/pages, /media, …): the app itself decides.
    location / {
        try_files $uri /index.html;
    }
}
